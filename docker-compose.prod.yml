# Entorno de PRODUCCIÓN (VPS).
#
# El sitio es 100% estático: una sola app Next (apps/web) que se prerenderiza
# en build y se sirve con Node. No hay base de datos ni API.
#
# Uso en el servidor:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: argislab-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '8000:3000'
