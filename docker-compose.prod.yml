# Entorno de PRODUCCIÓN (VPS).
#
# El sitio es 100% estático: una sola app Next (apps/web) que se prerenderiza
# en build y se sirve con Node. No hay base de datos ni API.
#
# Uso en el servidor:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Dominio real del sitio (canonical, sitemap, Open Graph). Cambialo si no es este.
        NEXT_PUBLIC_SITE_URL: https://argislab.com
    container_name: argislab-web
    restart: unless-stopped
    environment:
      NODE_ENV: production

    # Solo loopback: la única puerta pública es el Nginx del host.
    ports:
      -  "127.0.0.1:8000:3000"

    # Endurecimiento: sin capabilities extra, sin escalar privilegios, /tmp
    # efímero. Corre como usuario no-root (uid 1001, ver Dockerfile).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
