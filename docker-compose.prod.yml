# Entorno de PRODUCCIÓN (VPS).
#
# Diferencias con docker-compose.yml (local):
#   - NO se publica el puerto de PostgreSQL hacia Internet.
#     La base solo es accesible desde la red interna de Docker (otros contenedores).
#   - NO hay pgAdmin.
#   - Todas las variables son obligatorias: si falta una en el .env del servidor,
#     el arranque falla (no hay defaults).
#
# Uso en el servidor:
#   docker compose -f docker-compose.prod.yml up -d
#
# Si necesitás administrar la base desde tu máquina, hacé un túnel SSH:
#   ssh -L 5432:localhost:5432 usuario@vps
# y descomentá el bloque "ports" de abajo atado a 127.0.0.1.

services:
  postgres:
    image: postgres:16-alpine
    container_name: argislab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: argislab-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}

      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID}

    ports:
      - '3001:3000'

    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: 
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: argislab-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '8000:3000'
    depends_on:
      - api

volumes:
  postgres_prod_data: